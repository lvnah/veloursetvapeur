<!DOCTYPE html>
<html lang="fr" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demande de Devis | Velours & Vapeur</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preload" href="css/tailwind.css" as="style">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/tailwind.css">
</head>

<body class="bg-brand-cream text-brand-plum font-sans antialiased flex flex-col min-h-screen selection:bg-brand-plum selection:text-brand-cream tracking-tight">

    <header class="sticky top-0 z-50 bg-brand-plum/95 backdrop-blur-md border-b border-white/10 transition-all duration-300 text-brand-cream">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
            <a href="index.html" class="flex items-center group">
                <img decoding="async" src="images/logo.png" alt="Logo Velours & Vapeur" class="h-7 sm:h-9 w-auto object-contain">
            </a>
            <a href="index.html" class="text-xs font-bold text-brand-plum hover:bg-brand-beige transition-colors flex items-center gap-1.5 bg-brand-cream shadow-sm px-4 py-2 rounded-full">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="lucide lucide-chevron-left w-4 h-4 text-brand-plum">
  <path d="m15 18-6-6 6-6" />
</svg>
                <span>Retour au site</span>
            </a>
        </div>
    </header>

    <main class="flex-grow py-8 sm:py-16 px-4 sm:px-6 max-w-2xl mx-auto w-full relative">
        <div class="bg-white rounded-[24px] sm:rounded-[32px] p-6 sm:p-10 shadow-soft space-y-6 relative z-10 border border-brand-plum/5">

            <div class="text-center space-y-2">
                <p class="text-xs font-bold uppercase tracking-[0.2em] text-brand-plumLight">Estimation en ligne</p>
                <h1 class="text-2xl sm:text-4xl font-black text-brand-plum">
                    Demande de devis
                </h1>
                <p class="text-brand-plum/70 text-xs sm:text-sm font-medium">
                    Une proposition sur-mesure sous 24h à 48h.
                </p>
            </div>

            <div class="h-px w-full bg-brand-plum/10"></div>

            <form id="form-devis" action="https://formsubmit.co/veloursetvapeur@gmail.com" method="POST" enctype="multipart/form-data" class="space-y-5">
                <input type="hidden" name="_subject" value="✨ Nouvelle demande de devis - Velours & Vapeur">
                <input type="hidden" name="_template" value="box">
                <input type="hidden" name="_next" value="https://veloursetvapeur.netlify.app/merci.html">
                <input type="hidden" name="_captcha" value="false">
                <input type="text" name="_honey" class="hidden" style="display: none;" autocomplete="off">

                <!-- Type de client -->
                <div class="space-y-2">
                    <label class="block text-xs font-bold text-brand-plum/70 uppercase tracking-wider">Vous êtes :</label>
                    <div class="grid grid-cols-2 gap-3">
                        <label class="flex items-center justify-center gap-2 p-3 border rounded-xl sm:rounded-2xl cursor-pointer bg-brand-cream border-brand-plum/10 hover:border-brand-plum/40 font-bold text-xs transition-all text-brand-plum">
                            <input type="radio" name="Type_De_Client" value="Particulier" checked class="accent-brand-plum w-4 h-4">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="lucide lucide-user w-4 h-4 text-brand-plumLight">
  <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" />
  <circle cx="12" cy="7" r="4" />
</svg>
                            <span>Particulier</span>
                        </label>
                        <label class="flex items-center justify-center gap-2 p-3 border rounded-xl sm:rounded-2xl cursor-pointer bg-brand-cream border-brand-plum/10 hover:border-brand-plum/40 font-bold text-xs transition-all text-brand-plum">
                            <input type="radio" name="Type_De_Client" value="Professionnel" class="accent-brand-plum w-4 h-4">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="lucide lucide-building-2 w-4 h-4 text-brand-plumLight">
  <path d="M10 12h4" />
  <path d="M10 8h4" />
  <path d="M14 21v-3a2 2 0 0 0-4 0v3" />
  <path d="M6 10H4a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-2" />
  <path d="M6 21V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v16" />
</svg>
                            <span>Professionnel</span>
                        </label>
                    </div>
                </div>

                <!-- Nom et Ville -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div class="space-y-1.5">
                        <label class="block text-[11px] font-bold text-brand-plum/70 uppercase tracking-wider">Nom & Prénom / Entreprise</label>
                        <input type="text" name="Nom_Et_Prenom" id="name" required class="w-full p-3.5 bg-brand-cream border border-brand-plum/10 rounded-xl sm:rounded-2xl text-xs sm:text-sm text-brand-plum font-medium placeholder-brand-plum/30 focus:outline-none focus:border-brand-plum focus:ring-1 focus:ring-brand-plum transition-shadow">
                    </div>
                    <div class="space-y-1.5">
                        <label class="block text-[11px] font-bold text-brand-plum/70 uppercase tracking-wider">Ville de l'intervention</label>
                        <input type="text" name="Ville_Intervention" id="ville" placeholder="Ex: Perpignan" required class="w-full p-3.5 bg-brand-cream border border-brand-plum/10 rounded-xl sm:rounded-2xl text-xs sm:text-sm text-brand-plum font-medium placeholder-brand-plum/30 focus:outline-none focus:border-brand-plum focus:ring-1 focus:ring-brand-plum transition-shadow">
                    </div>
                </div>

                <!-- Adresse -->
                <div class="space-y-1.5">
                    <label class="block text-[11px] font-bold text-brand-plum/70 uppercase tracking-wider">Adresse</label>
                    <input type="text" name="Adresse" id="adresse" placeholder="Ex: 12 rue de la République, 66000 Perpignan" required class="w-full p-3.5 bg-brand-cream border border-brand-plum/10 rounded-xl sm:rounded-2xl text-xs sm:text-sm text-brand-plum font-medium placeholder-brand-plum/30 focus:outline-none focus:border-brand-plum focus:ring-1 focus:ring-brand-plum transition-shadow">
                </div>

                <!-- Email et Téléphone -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div class="space-y-1.5">
                        <label class="block text-[11px] font-bold text-brand-plum/70 uppercase tracking-wider">Adresse Email</label>
                        <input type="email" name="Email_Client" id="email" required class="w-full p-3.5 bg-brand-cream border border-brand-plum/10 rounded-xl sm:rounded-2xl text-xs sm:text-sm text-brand-plum font-medium placeholder-brand-plum/30 focus:outline-none focus:border-brand-plum focus:ring-1 focus:ring-brand-plum transition-shadow">
                    </div>
                    <div class="space-y-1.5">
                        <label class="block text-[11px] font-bold text-brand-plum/70 uppercase tracking-wider">Téléphone</label>
                        <input type="tel" name="Telephone_Contact" id="phone" required class="w-full p-3.5 bg-brand-cream border border-brand-plum/10 rounded-xl sm:rounded-2xl text-xs sm:text-sm text-brand-plum font-medium placeholder-brand-plum/30 focus:outline-none focus:border-brand-plum focus:ring-1 focus:ring-brand-plum transition-shadow">
                    </div>
                </div>

                <!-- Prestation -->
                <div class="space-y-1.5">
                    <label class="block text-[11px] font-bold text-brand-plum/70 uppercase tracking-wider">Prestation souhaitée</label>
                    <select name="Prestation_Demande" id="prestation" required class="w-full p-3.5 bg-brand-cream border border-brand-plum/10 rounded-xl sm:rounded-2xl text-xs sm:text-sm font-medium focus:outline-none focus:border-brand-plum focus:ring-1 focus:ring-brand-plum transition-shadow text-brand-plum">
                        <option value="" disabled selected>Sélectionnez une option...</option>
                        <option value="Canapé / Fauteuil / Chaises">Canapé / Fauteuil / Chaises</option>
                        <option value="Matelas / Literie">Matelas / Literie</option>
                        <option value="Intérieur Véhicule">Intérieur de véhicule</option>
                        <option value="Tapis / Moquette">Tapis / Moquette</option>
                        <option value="Autre demande">Autre demande spécifique</option>
                    </select>
                </div>

                <!-- Message -->
                <div class="space-y-1.5">
                    <label class="block text-[11px] font-bold text-brand-plum/70 uppercase tracking-wider">Détails (dimensions, état, taches...)</label>
                    <textarea name="Details_De_La_Demande" id="message" rows="3" placeholder="Ex: Canapé d'angle 4 places en tissu beige..." required class="w-full p-3.5 bg-brand-cream border border-brand-plum/10 rounded-xl sm:rounded-2xl text-xs sm:text-sm text-brand-plum font-medium placeholder-brand-plum/30 focus:outline-none focus:border-brand-plum focus:ring-1 focus:ring-brand-plum transition-shadow"></textarea>
                </div>

                <!-- Photos (obligatoire) -->
                <div class="space-y-1.5">
                    <label for="photos" class="block text-[11px] font-bold text-brand-plum/70 uppercase tracking-wider flex items-center gap-1.5">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="lucide lucide-camera w-4 h-4 text-brand-plumLight">
  <path d="M13.997 4a2 2 0 0 1 1.76 1.05l.486.9A2 2 0 0 0 18.003 7H20a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h1.997a2 2 0 0 0 1.759-1.048l.489-.904A2 2 0 0 1 10.004 4z" />
  <circle cx="12" cy="13" r="3" />
</svg>
                        <span>Photos <span class="text-brand-plumLight">*</span> (Obligatoire - 1 à 3 photos)</span>
                    </label>
                    <input type="file" name="attachment" id="photos" accept="image/*" multiple required class="w-full p-2.5 bg-brand-cream border border-brand-plum/10 rounded-xl text-xs text-brand-plum font-medium file:mr-3 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-bold file:bg-brand-plum file:text-brand-cream cursor-pointer hover:file:bg-brand-plumLight transition-colors">
                    <p class="text-[11px] text-brand-plum/60 font-medium">Au moins une photo est nécessaire pour établir votre devis.</p>
                    <p id="photos-error" class="hidden text-[11px] font-bold text-red-700"></p>
                </div>

                <!-- Bouton -->
                <div class="pt-4">
                    <button type="submit" id="btn-submit" class="w-full bg-brand-plum text-brand-cream py-4 rounded-full font-bold shadow-md hover:bg-brand-plumLight transition-all text-xs uppercase tracking-wider flex items-center justify-center gap-2">
                        <span>Envoyer ma demande</span>
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="lucide lucide-arrow-right w-4 h-4">
  <path d="M5 12h14" />
  <path d="m12 5 7 7-7 7" />
</svg>
                    </button>
                </div>
            </form>
        </div>
    </main>

    <footer class="bg-brand-plumDark py-6 text-center text-xs text-brand-cream/60">
        <p>© 2026 VELOURS ET VAPEUR</p>
    </footer>

    <script>
        document.getElementById('form-devis').addEventListener('submit', function (e) {
            const fileInput = document.getElementById('photos');
            const btnSubmit = document.getElementById('btn-submit');
            const errorBox = document.getElementById('photos-error');
            errorBox.classList.add('hidden');

            const count = fileInput.files.length;
            if (count === 0) {
                e.preventDefault();
                errorBox.textContent = "Veuillez ajouter au moins une photo pour envoyer votre demande.";
                errorBox.classList.remove('hidden');
                fileInput.focus();
                return false;
            }
            if (count > 3) {
                e.preventDefault();
                errorBox.textContent = "Vous pouvez envoyer 3 photos maximum.";
                errorBox.classList.remove('hidden');
                fileInput.value = "";
                return false;
            }
            const totalSize = Array.from(fileInput.files).reduce((acc, file) => acc + file.size, 0);
            if (totalSize > 10 * 1024 * 1024) {
                e.preventDefault();
                errorBox.textContent = "Vos photos dépassent 10 Mo au total.";
                errorBox.classList.remove('hidden');
                fileInput.value = "";
                return false;
            }
            btnSubmit.innerHTML = "⏳ Envoi en cours...";
            btnSubmit.classList.add('opacity-75', 'cursor-not-allowed');
        });
    </script>
</body>

</html>
