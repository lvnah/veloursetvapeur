<!DOCTYPE html>
<html lang="fr" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demande Envoyée | Velours & Vapeur</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Plus Jakarta Sans', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'] },
                    colors: {
                        brand: {
                            plum: '#4a1531',
                            plumDark: '#2d0c1d',
                            plumLight: '#73234d',
                            cream: '#fcfaf8',
                            beige: '#f0e8df',
                        }
                    },
                    boxShadow: {
                        'soft': '0 10px 40px -10px rgba(74, 21, 49, 0.08)',
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-brand-cream text-brand-plum font-sans antialiased flex flex-col min-h-screen selection:bg-brand-plum selection:text-brand-cream tracking-tight">

    <header class="sticky top-0 z-50 bg-brand-plum/95 backdrop-blur-md border-b border-white/10 transition-all duration-300 text-brand-cream">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
            <a href="index.html" class="flex items-center group">
                <img src="images/logo.png" alt="Logo Velours & Vapeur" class="h-7 sm:h-9 w-auto object-contain">
            </a>
            <a href="index.html" class="text-xs font-bold text-brand-plum hover:bg-brand-beige transition-colors flex items-center gap-1.5 bg-brand-cream shadow-sm px-4 py-2 rounded-full">
                <i data-lucide="chevron-left" class="w-4 h-4 text-brand-plum"></i>
                <span>Accueil</span>
            </a>
        </div>
    </header>

    <main class="flex-grow py-16 sm:py-24 px-4 sm:px-6 max-w-lg mx-auto w-full flex items-center justify-center">
        <div class="bg-white rounded-[32px] p-8 sm:p-12 shadow-soft space-y-6 text-center border border-brand-plum/5">

            <div class="w-16 h-16 sm:w-20 sm:h-20 bg-brand-plum text-brand-cream rounded-full flex items-center justify-center mx-auto shadow-md">
                <i data-lucide="check" class="w-8 h-8 sm:w-10 sm:h-10"></i>
            </div>

            <div class="space-y-3">
                <p class="text-xs font-bold uppercase tracking-[0.2em] text-brand-plumLight">Transmission réussie</p>
                <h1 class="text-2xl sm:text-4xl font-black text-brand-plum">
                    Merci pour votre demande
                </h1>
                <p class="text-brand-plum/70 text-xs sm:text-sm leading-relaxed font-medium">
                    Votre message et vos photos ont bien été transmis à Guillaume. Une proposition personnalisée vous sera adressée sous 24h à 48h.
                </p>
            </div>

            <div class="pt-6">
                <a href="index.html" class="w-full bg-brand-plum text-brand-cream py-4 rounded-full font-bold shadow-md hover:bg-brand-plumLight transition-all text-xs uppercase tracking-wider inline-flex items-center justify-center gap-2">
                    <span>Retourner sur le site</span>
                    <i data-lucide="arrow-right" class="w-4 h-4"></i>
                </a>
            </div>
        </div>
    </main>

    <footer class="bg-brand-plumDark py-6 text-center text-xs text-brand-cream/60">
        <p>© 2026 VELOURS ET VAPEUR</p>
    </footer>

    <script>lucide.createIcons();</script>
</body>

</html>
